
services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5532:5532"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment: &backend_env
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DJANGO_DEBUG}
      - KLIK_BASE_URL=${KLIK_BASE_URL}
      - KLIK_BANK_API_KEY=${KLIK_BANK_API_KEY}
      - KLIK_ZONE=${KLIK_ZONE}
      - CARD_GATEWAY_BASE_URL=${CARD_GATEWAY_BASE_URL}
      - CARD_GATEWAY_API_KEY=${CARD_GATEWAY_API_KEY}
      - CARD_GATEWAY_HMAC_SECRET=${CARD_GATEWAY_HMAC_SECRET}
      # UK Payment Systems (CHAPS/FPS/BACS) — reached over the host network.
      - UKPS_CHAPS_URL=${UKPS_CHAPS_URL:-http://host.docker.internal:8420}
      - UKPS_FPS_URL=${UKPS_FPS_URL:-http://host.docker.internal:8421}
      - UKPS_BACS_URL=${UKPS_BACS_URL:-http://host.docker.internal:8422}
      - UKPS_BANK_BIC=${UKPS_BANK_BIC:-SNDRUK22}
      - UKPS_BANK_NAME=${UKPS_BANK_NAME:-Alice Bank}
      - UKPS_BANK_SORT_CODE=${UKPS_BANK_SORT_CODE:-60-00-00}
      - UKPS_BANK_SU_CODE=${UKPS_BANK_SU_CODE:-SU-ALCE}
      - UKPS_CHAPS_API_KEY=${UKPS_CHAPS_API_KEY:-ak_sndruk22_dev}
      - UKPS_FPS_API_KEY=${UKPS_FPS_API_KEY:-ak_sndruk22_dev}
      - UKPS_BACS_API_KEY=${UKPS_BACS_API_KEY:-ak_sndruk22_dev}
      - UKPS_AUTO_REGISTER=${UKPS_AUTO_REGISTER:-False}
      - UKPS_INBOUND_FALLBACK_ACCOUNT=${UKPS_INBOUND_FALLBACK_ACCOUNT:-}

    depends_on:
      - db

    networks:
      default:
      cards-backend:
        aliases:
          - uk-bank-a

  # Long-running consumer of inbound CHAPS/FPS/BACS payments (SSE).
  ukps-listener:
    build: ./backend
    command: python manage.py ukps_listen
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      - db
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
  

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  cards-backend:
    external: true
    name: cards-backend
