services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py ensure_admin &&
      python manage.py seed_demo &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment: &backend_env
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432

      # Auto-created Django admin user
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@test.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123}
      - DJANGO_SUPERUSER_RESET_PASSWORD=${DJANGO_SUPERUSER_RESET_PASSWORD:-False}

      # KLIK
      - KLIK_BASE_URL=${KLIK_BASE_URL}
      - KLIK_BANK_API_KEY=${KLIK_BANK_API_KEY}
      - KLIK_ZONE=${KLIK_ZONE}

      # Card gateway
      - CARD_GATEWAY_BASE_URL=${CARD_GATEWAY_BASE_URL}
      - CARD_GATEWAY_API_KEY=${CARD_GATEWAY_API_KEY}
      - CARD_GATEWAY_HMAC_SECRET=${CARD_GATEWAY_HMAC_SECRET}

      # UK Payment Systems CHAPS/FPS/BACS
      - UKPS_CHAPS_URL=${UKPS_CHAPS_URL:-http://host.docker.internal:8420}
      - UKPS_FPS_URL=${UKPS_FPS_URL:-http://host.docker.internal:8421}
      - UKPS_BACS_URL=${UKPS_BACS_URL:-http://host.docker.internal:8422}
      - UKPS_BANK_BIC=${UKPS_BANK_BIC:-LYOBGB2L}
      - UKPS_BANK_NAME=${UKPS_BANK_NAME:-Lyo Bank}
      - UKPS_BANK_SORT_CODE=${UKPS_BANK_SORT_CODE:-10-20-30}
      - UKPS_BANK_SU_CODE=${UKPS_BANK_SU_CODE:-SU-LYOB}
      - UKPS_CHAPS_API_KEY=${UKPS_CHAPS_API_KEY:-}
      - UKPS_FPS_API_KEY=${UKPS_FPS_API_KEY:-}
      - UKPS_BACS_API_KEY=${UKPS_BACS_API_KEY:-}
      - UKPS_AUTO_REGISTER=${UKPS_AUTO_REGISTER:-True}
      - UKPS_INBOUND_FALLBACK_ACCOUNT=${UKPS_INBOUND_FALLBACK_ACCOUNT:-}
      - UKPS_BIC_SORT_200000=${UKPS_BIC_SORT_200000:-BARCGB2L}
      - UKPS_BIC_SORT_400000=${UKPS_BIC_SORT_400000:-HSBCGB44}
      - UKPS_BIC_SORT_300000=${UKPS_BIC_SORT_300000:-LLOYGB21}
      - UKPS_BIC_SORT_600000=${UKPS_BIC_SORT_600000:-SNDRUK22}

      # SWIFT middleware — outgoing international transfers
      - SWIFT_BASE_URL=${SWIFT_BASE_URL:-http://host.docker.internal:3000}
      - SWIFT_CLIENT_ID=${SWIFT_CLIENT_ID:-bank-ukbkgb01}
      - SWIFT_CLIENT_SECRET=${SWIFT_CLIENT_SECRET:-secret-ukbkgb01}
      - SWIFT_BANK_BIC=${SWIFT_BANK_BIC:-UKBKGB01XXX}
      - SWIFT_BANK_NAME=${SWIFT_BANK_NAME:-Lyo Bank}
      - SWIFT_AUTO_SEND=${SWIFT_AUTO_SEND:-True}
      - SWIFT_RATE_GBP_USD=${SWIFT_RATE_GBP_USD:-1.25}
      - SWIFT_RATE_GBP_EUR=${SWIFT_RATE_GBP_EUR:-1.15}
      - SWIFT_RATE_GBP_PLN=${SWIFT_RATE_GBP_PLN:-5.00}
      - SWIFT_FEE_OUR_GBP=${SWIFT_FEE_OUR_GBP:-15.00}
      - SWIFT_FEE_SHA_GBP=${SWIFT_FEE_SHA_GBP:-5.00}
      - SWIFT_FEE_BEN_GBP=${SWIFT_FEE_BEN_GBP:-0.00}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      cards-backend:
        aliases:
          - uk-bank-a
      target_klik:

  ukps-listener:
    build: ./backend
    command: >
      sh -c "
      until python manage.py migrate --check >/dev/null 2>&1; do
        echo 'Waiting for backend migrations...';
        sleep 2;
      done;

      python manage.py wait_for_ukps --timeout 0 &&

      echo 'Registering bank in UKPS...' &&
      python manage.py ukps_register &&

      echo 'Current UKPS registration keys:' &&
      python manage.py ukps_keys &&

      echo 'Starting UKPS listener...' &&
      python manage.py ukps_listen
      "
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  cards-backend:
    external: true
    name: cards-backend
  target_klik:
    external: true
    name: target_klik